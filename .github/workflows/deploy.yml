name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 브라우저에서 md 파일만 커밋해도 배포되지만, 손으로 돌리고 싶을 때를 위해.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연속 push 시 앞선 빌드를 취소합니다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 설치 → 빌드 → 아티팩트 업로드까지 이 액션이 처리합니다.
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 20

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
